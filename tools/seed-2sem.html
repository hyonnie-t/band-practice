<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2학기 연습일정 가져오기</title>
<link rel="stylesheet" href="../style.css">
<style>
  body{ padding:20px; padding-bottom:40px; max-width:520px; margin:0 auto; }
  #importLog{ margin-top:16px; max-height:60vh; overflow-y:auto; }
  .log-line{ font-size:13px; padding:5px 0; border-bottom:1px solid var(--border); }
  .log-line.ok{ color:var(--teal); }
  .log-line.skip{ color:var(--ink-soft); }
  .log-line.err{ color:var(--coral); font-weight:700; }
</style>
</head>
<body>

<!--
  2학기 연습일정 가져오기 (1회용 관리자 도구)
  ------------------------------------------------------------
  출처: 구글시트 "2학기 연습일정보고"(연습일정(2학기) 탭), 2026-09-10 확인.
  이 파일 안의 SEED_EVENTS / SEED_SCHOOL_CALENDAR는 그 시트 내용을
  그대로 옮긴 값이라, 실행 이후 시트가 바뀌면 이 파일도 다시 손봐야 함.

  events는 (날짜, 곡명) 조합이 이미 있으면 건너뛰고,
  schoolCalendar는 같은 날짜에 이미 값이 있으면 건너뛰어서
  — 몇 번을 다시 눌러도 중복 생성 안 됨. 곡 자체(songs)는
  건드리지 않음(이미 자료실에 등록된 곡 정보를 그대로 참조만 함) —
  등록 안 된 곡명은 새로 만들지 않고 건너뛰고 로그로 알려줌.
-->

  <div class="section-title">2학기 연습일정 가져오기</div>
  <div class="section-sub">
    구글시트 "2학기 연습일정보고" 내용을 일정(events)·학사일정(schoolCalendar)에 채워넣는 1회용 도구야.
    이미 있는 건 그대로 두고 건너뛰니까 여러 번 눌러도 안전해. 관리자 키 입력하고 실행하면 돼.
  </div>

  <div class="card" id="gate">
    <div class="field"><label>관리자 키</label><input type="password" id="keyInput" placeholder="관리자 키 입력"></div>
    <button class="btn btn-primary btn-block" id="runBtn">가져오기 실행</button>
  </div>

  <div id="importLog"></div>

  <script src="../config.js"></script>
  <script>
    // ---------------- REST 헬퍼 (app.js와 동일 패턴) ----------------
    async function dbGet(path){
      const res = await fetch(`${DB_URL}/${path}.json`);
      if(!res.ok) throw new Error('dbGet failed: ' + path);
      return res.json();
    }
    async function dbSet(path, value){
      const res = await fetch(`${DB_URL}/${path}.json`, { method:'PUT', body: JSON.stringify(value) });
      if(!res.ok) throw new Error('dbSet failed: ' + path);
      return res.json();
    }
    async function dbPush(path, value){
      const res = await fetch(`${DB_URL}/${path}.json`, { method:'POST', body: JSON.stringify(value) });
      if(!res.ok) throw new Error('dbPush failed: ' + path);
      return res.json();
    }
    async function sha256Hex(text){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }

    const ROLES = ['보컬','일렉1','일렉2','통기타','베이스','드럼','피아노','신디','트럼펫'];

    // ---------------- 시트 원본 데이터 ----------------
    // [날짜, 곡명] — 연습곡이 배정된 날만. 시험/휴일/동아리 등은 아래 SCHOOL_CALENDAR로.
    const SEED_EVENTS = [
      ['2026-08-26','오리날다'], ['2026-08-27','너에게 닿기를'],
      ['2026-09-03','그라데이션'], ['2026-09-10','나에게로 떠나는 여행'],
      ['2026-09-16','오리날다'], ['2026-09-17','타임캡슐'],
      ['2026-10-01','너에게 닿기를'], ['2026-10-15','그라데이션'],
      ['2026-10-21','오리날다'], ['2026-10-22','나에게로 떠나는 여행'],
      ['2026-11-05','타임캡슐'], ['2026-11-11','너에게 닿기를'],
      ['2026-11-25','오리날다'], ['2026-11-26','그라데이션'],
      ['2026-12-03','나에게로 떠나는 여행'], ['2026-12-10','타임캡슐'],
    ];

    // type은 CAL_TYPE_LABEL(holiday/exam/discretionary/club) 4종 중 하나거나,
    // 딱 맞는 게 없으면 'school'(학사일정, app.js가 알아서 "학사일정"으로 표시)로 둠.
    const SEED_SCHOOL_CALENDAR = {
      '2026-08-17': { label:'대체공휴일',     type:'holiday' },
      '2026-08-18': { label:'개학식',         type:'school' },
      '2026-08-24': { label:'동아리',         type:'club' },
      '2026-09-07': { label:'대체공휴일',     type:'holiday' },
      '2026-09-22': { label:'중간고사',       type:'exam' },
      '2026-09-24': { label:'추석연휴',       type:'holiday' },
      '2026-09-25': { label:'추석',           type:'holiday' },
      '2026-10-05': { label:'대체공휴일',     type:'holiday' },
      '2026-10-07': { label:'동아리',         type:'club' },
      '2026-10-08': { label:'체육체험의날',   type:'school' },
      '2026-10-09': { label:'한글날',         type:'holiday' },
      '2026-10-28': { label:'기말고사(3)',    type:'exam' },
      '2026-10-29': { label:'기말고사(3)',    type:'exam' },
      '2026-10-30': { label:'기말고사(3)',    type:'exam' },
      '2026-11-06': { label:'진로의 날',      type:'school' },
      '2026-11-11': { label:'동아리',         type:'club' },
      '2026-11-19': { label:'수능(재량휴업)', type:'discretionary' },
      '2026-11-20': { label:'재량휴업일',     type:'discretionary' },
      '2026-12-14': { label:'기말고사(1,2)',  type:'exam' },
      '2026-12-15': { label:'기말고사(1,2)',  type:'exam' },
      '2026-12-16': { label:'기말고사(1,2)',  type:'exam' },
      '2026-12-18': { label:'동아리',         type:'club' },
      '2026-12-25': { label:'성탄절',         type:'holiday' },
      '2027-01-01': { label:'신정',           type:'holiday' },
      '2027-01-06': { label:'본공연!!!!!',    type:'school' },
    };

    // ---------------- 로그 ----------------
    const logRoot = document.getElementById('importLog');
    function log(msg, cls){
      const div = document.createElement('div');
      div.className = 'log-line ' + (cls||'');
      div.textContent = msg;
      logRoot.appendChild(div);
    }

    document.getElementById('runBtn').addEventListener('click', async ()=>{
      const runBtn = document.getElementById('runBtn');
      const key = document.getElementById('keyInput').value;
      const hash = await sha256Hex(key);
      if(hash !== ADMIN_KEY_HASH){ log('관리자 키가 맞지 않아. 다시 확인해줘.', 'err'); return; }

      runBtn.disabled = true;
      logRoot.innerHTML = '';
      log('DB 조회 중...');

      let songs, events, schoolCalendar;
      try{
        [songs, events, schoolCalendar] = await Promise.all([
          dbGet('songs'), dbGet('events'), dbGet('schoolCalendar')
        ]);
      }catch(err){
        log('DB 조회 실패: ' + err.message, 'err');
        runBtn.disabled = false;
        return;
      }
      songs = songs || {}; events = events || {}; schoolCalendar = schoolCalendar || {};

      // 이미 있는 (날짜, 곡명) 조합 — 중복 생성 방지
      const existingPairs = new Set(
        Object.values(events).map(e => `${e.date}__${e.songId}`)
      );

      log('연습일정(events) 추가 시작...');
      for(const [date, songId] of SEED_EVENTS){
        if(existingPairs.has(`${date}__${songId}`)){
          log(`건너뜀 (이미 있음): ${date} ${songId}`, 'skip');
          continue;
        }
        const song = songs[songId];
        if(!song){
          log(`건너뜀 (자료실에 "${songId}" 곡 정보가 없어 — 먼저 등록해줘): ${date} ${songId}`, 'err');
          continue;
        }
        const participants = [];
        ROLES.forEach(role=>{
          (song.roles[role]||[]).forEach(entry=>{
            participants.push({ name: entry.name, role });
          });
        });
        const absence = {};
        participants.forEach(p=>{ absence[p.name] = { absent:false, reason:'' }; });
        const payload = { date, songId, status:'예정', note:'', participants, absence };
        try{
          await dbPush('events', payload);
          log(`추가됨: ${date} ${songId}`, 'ok');
        }catch(err){
          log(`실패: ${date} ${songId} — ${err.message}`, 'err');
        }
      }

      log('학사일정(schoolCalendar) 추가 시작...');
      for(const [date, info] of Object.entries(SEED_SCHOOL_CALENDAR)){
        if(schoolCalendar[date]){
          log(`건너뜀 (이미 있음): ${date} ${schoolCalendar[date].label}`, 'skip');
          continue;
        }
        try{
          await dbSet(`schoolCalendar/${date}`, info);
          log(`추가됨: ${date} ${info.label}`, 'ok');
        }catch(err){
          log(`실패: ${date} ${info.label} — ${err.message}`, 'err');
        }
      }

      log('완료.');
      runBtn.disabled = false;
    });
  </script>
</body>
</html>
